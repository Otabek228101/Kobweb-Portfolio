name: Deploy Kobweb site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:       

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KOBWEB_CLI_VERSION: 0.9.23 
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Query browser cache ID
        id: browser-cache-id
        run: echo "value=$(./gradlew -q :site:kobwebBrowserCacheId)" >> $GITHUB_OUTPUT

      - name: Cache browser dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.browser-cache-id.outputs.value }}

      - name: Fetch Kobweb CLI
        uses: robinraju/release-downloader@v1
        with:
          repository: varabyte/kobweb-cli
          tag: v${{ env.KOBWEB_CLI_VERSION }}
          fileName: kobweb-${{ env.KOBWEB_CLI_VERSION }}.zip
          tarBall: false
          zipBall: false

      - name: Unzip Kobweb CLI
        run: unzip kobweb-${{ env.KOBWEB_CLI_VERSION }}.zip

      - name: Export site
        run: |
          cd site
          ../kobweb-${{ env.KOBWEB_CLI_VERSION }}/bin/kobweb export --notty --layout static

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.kobweb/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4